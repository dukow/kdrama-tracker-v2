name: Build KDrama Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Show versions
        run: |
          flutter --version
          java -version

      - name: Create skeleton
        run: flutter create --org com.dukoow --project-name kdrama_tracker --platforms=android skeleton_app

      - name: Copy sources
        run: |
          cp -r lib/* skeleton_app/lib/
          cp pubspec.yaml skeleton_app/pubspec.yaml

      - name: Patch manifest
        run: |
          M=skeleton_app/android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' $M
          sed -i '/<queries>/a\        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>' $M
          cat $M

      - name: Get dependencies
        working-directory: skeleton_app
        run: flutter pub get

      - name: Analyze
        working-directory: skeleton_app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APKs
        working-directory: skeleton_app
        run: flutter build apk --release --split-per-abi

      - name: List APKs
        run: ls -lh skeleton_app/build/app/outputs/flutter-apk/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kdrama-tracker-apk
          path: skeleton_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
